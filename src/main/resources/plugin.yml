name: RankSystem
version: ${version}
main: id.bagus.rank.RankPlugin
api-version: '26.2'
softdepend: [Vault, PlaceholderAPI]

description: Sistem rank dengan prefix gradient dan animasi, permission per rank, serta integrasi TAB dan EssentialsX Chat.
authors:
  - BagusDev

commands:
  rank:
    description: Kelola rank pemain
    usage: /rank <set|remove|info|list|reload>
    permission: ranks.admin
  progress:
    description: Lihat progres menuju rank berikutnya
    usage: /progress
    aliases: [ rankprogress ]