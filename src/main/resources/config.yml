# ==============================================================================
#  RankSystem - config.yml
# ==============================================================================
#  After editing this file, run:  /rank reload
#
#  Prefixes and the chat format use MiniMessage:
#    Colors      : <red>text</red>, <#ff8800>text</#ff8800>
#    Styles      : <bold>, <italic>, <underlined>, <strikethrough>
#    Gradient    : <gradient:red:blue>text</gradient>
#    Reset       : <reset>
#  Full documentation: https://docs.advntr.dev/minimessage/format.html
#
#  IMPORTANT: close every tag you open, and do not use legacy color codes
#  (&a, §a). Plugin messages live in the lang/ folder, not in this file.
# ==============================================================================

# Language of the plugin messages. Must match a file name in the lang/ folder
# (without .yml). Bundled: en (English), id (Indonesian). For another language,
# copy lang/en.yml to lang/<code>.yml, translate it, then put the code here.
language: en

# ------------------------------------------------------------------------------
#  DEFAULT RANK
# ------------------------------------------------------------------------------
#  The rank used by players who have never been given a rank with /rank set.
#  The value must match one of the rank IDs in the "ranks" section below.
#  If the ID is not found, the plugin uses the first rank listed.
default-rank: citizen


# ------------------------------------------------------------------------------
#  CHAT FORMAT
# ------------------------------------------------------------------------------
chat:
  # true  = this plugin formats chat (the rank prefix appears in chat)
  # false = chat keeps the format of the server / another plugin
  #         (for example EssentialsX Chat)
  enabled: false

  # Available placeholders:
  #   <prefix>  = the player's rank prefix (from "ranks.<id>.prefix")
  #   <player>  = the player's name
  #   <message> = the message the player typed
  #
  # Example result: [VIP] Steve » hello everyone
  format: "<prefix> <gray><player></gray><dark_gray> » </dark_gray><white><message></white>"

# ------------------------------------------------------------------------------
#  PREFIX ANIMATION
# ------------------------------------------------------------------------------
#  Applies to prefixes that use {phase}, for example:
#    <gradient:#f7971e:#ffd200:{phase}>[Owner]</gradient>
animation:
  # Duration of one animation cycle in milliseconds. Lower = faster.
  period-ms: 4000

# ------------------------------------------------------------------------------
#  AUTOMATIC RANK-UP
# ------------------------------------------------------------------------------
#  Requirements are defined per rank in its "requirements" section
#  (see the ranks section below).
auto-rankup:
  enabled: true
  # How often the plugin checks online players (seconds, minimum 10)
  check-interval-seconds: 60

  # Server-wide announcement. Only ranks with weight >= this value are announced.
  broadcast-enabled: true
  broadcast-min-weight: 15

  # Large text in the middle of the screen
  # (the text itself is in the language file: rankup.title / rankup.subtitle)
  title:
    enabled: true
    fade-in-ms: 500
    stay-ms: 3500
    fade-out-ms: 1000

  # Sound played for the player who ranks up
  sound:
    enabled: true
    key: "minecraft:ui.toast.challenge_complete"
    volume: 1.0
    pitch: 1.0

  # Particle effect around the player (nearby players can see it too)
  particles:
    enabled: true

# ------------------------------------------------------------------------------
#  TAB LIST (the player list shown when pressing TAB)
# ------------------------------------------------------------------------------
tablist:
  # true  = the tab list name becomes "<prefix> <name>"
  # false = the tab list name is left untouched
  #         (set this to false if a plugin such as TAB manages the tab list)
  enabled: true

# ------------------------------------------------------------------------------
#  RANK LIST
# ------------------------------------------------------------------------------
#  Each rank is written in this format:
#
#    <id>:                      # Rank ID. Used in commands and in "inherits".
#                               # Lowercase, no spaces (example: vip, mod-senior)
#      display-name: "Name"     # Name shown in plugin messages.
#      prefix: "<green>[VIP]"   # Text in front of the player's name (chat and
#                               # tab list), MiniMessage format.
#      weight: 10               # Rank level. Higher number = higher rank.
#                               # Used for the /rank list order, automatic rank-up
#                               # (only upwards, to a higher weight) and
#                               # announcements.
#      requirements:            # (optional) requirements to rank up to this rank
#                               # automatically.
#        playtime-hours: 10     # total hours played (decimals allowed, e.g. 0.5)
#        exp: 2000              # total XP earned (not the level)
#                               # A rank without "requirements" is never reached
#                               # automatically.
#      inherits: [member]       # Ranks whose permissions are inherited (may be
#                               # empty: []). Inheritance can be chained
#                               # (admin -> vip -> member).
#      permissions:             # Permissions granted by this rank.
#        - some.permission      # Grant a permission.
#        - "-some.permission"   # Prefix with "-" to REVOKE a permission
#                               # (including one inherited from another rank).
#                               # Quotes are required for entries starting with "-".
#
#  Important rules:
#   - Do not make ranks inherit each other in a loop (A inherits B, B inherits A).
#     The plugin will not crash, but circular inheritance is ignored.
#   - A rank's own permissions always override inherited ones.
#   - If you remove a rank from this file, players holding it fall back to the
#     default rank.
#   - The "ranks.admin" permission is required to use the /rank command.
ranks:
  citizen:
    display-name: "Citizen"
    prefix: "<gray>[Citizen]</gray>" # plain, the most basic rank
    weight: 1
    inherits: []
    permissions:
      # Homes and basic teleporting
      - essentials.sethome
      - essentials.home
      - essentials.delhome
      - essentials.back
      - essentials.spawn
      # Communication and info
      - essentials.msg
      - essentials.ignore
      - essentials.help
      - essentials.list
      - essentials.rules
      - essentials.motd
      # Economy
      - essentials.balance
      - essentials.pay
      - essentials.balancetop
      - essentials.afk

  wanderer:
    display-name: "Wanderer"
    prefix: "<green>[Wanderer]</green>"
    weight: 5
    inherits: [citizen]          # inherits the permissions of the rank below
    # Test values. Suggested for production: playtime-hours: 2, exp: 300
    requirements:
      playtime-hours: 0.01
      exp: 10
    permissions:
      - essentials.sethome.multiple.wanderer

  explorer:
    display-name: "Explorer"
    prefix: "<aqua><bold>[Explorer]</bold></aqua>"
    weight: 10
    inherits: [wanderer]         # inherits the permissions of the rank below
    requirements:
      playtime-hours: 10
      exp: 2000
    permissions:
      - essentials.sethome.multiple.explorer
      - essentials.tpa               # teleporting to friends is unlocked here
      - essentials.tpahere
      - essentials.tpaccept
      - essentials.tpdeny
      - essentials.tpacancel

  veteran:
    display-name: "Veteran"
    prefix: "<gold><bold>[Veteran]</bold></gold>"
    weight: 15
    inherits: [explorer]         # inherits the permissions of the rank below
    requirements:
      playtime-hours: 30
      exp: 8000
    permissions:
      - essentials.sethome.multiple.veteran
      - essentials.back.ondeath      # /back to the death location

  elite:
    display-name: "Elite"
    prefix: "<gradient:#8e2de2:#ff6ec7><bold>[Elite]</bold></gradient>"
    weight: 20
    inherits: [veteran]          # inherits the permissions of the rank below
    requirements:
      playtime-hours: 80
      exp: 25000
    permissions:
      - essentials.sethome.multiple.elite
      - essentials.nick              # change nickname
      - essentials.chat.color        # may use colors in chat

  # --- Staff ranks: no requirements, assigned manually with /rank set ---------
  moderator:
    display-name: "Moderator"
    prefix: "<gradient:#ff512f:#dd2476><bold>[MOD]</bold></gradient>"
    weight: 50
    inherits: [elite]
    permissions:
      - essentials.fly
      - essentials.sethome.multiple.staff
      - essentials.kick
      - essentials.mute
      - essentials.tempban
      - essentials.tp
      - essentials.tphere
      - essentials.invsee
      - essentials.vanish
      - essentials.socialspy
      - essentials.seen
      - essentials.whois

  owner:
    display-name: "Owner"
    prefix: "<gradient:#f7971e:#ffd200:{phase}><bold>[Owner]</bold></gradient>" # animated gradient
    weight: 100
    inherits: [moderator]
    permissions:
      - ranks.admin                  # required to use /rank
      - essentials.*